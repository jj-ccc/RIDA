# unet mitoem_r2h
_base_: ./unet.yaml
benchmark: mitoem
direction: r2h
classes: [mito]
evaluation: em
data:
  num_classes: 2
  kind: mito
  source_images: data/em_volumes/MitoEM/rat/training.hdf
  source_labels: data/em_volumes/MitoEM/rat/training_groundtruth.hdf
  target_images: data/em_volumes/MitoEM/human/training.hdf
  test_images: data/em_volumes/MitoEM/human/testing.hdf
  test_labels: data/em_volumes/MitoEM/human/testing_groundtruth.hdf
  crop_size: 512
  target_crop_size: 512
  test_size: 1024
  source_stride: 1
  target_stride: 1
model:
  in_channels: 1
  paired: true
warmup:
  iters: 10000
  batch_size: 4
  lr_schedule: cosine
  lr_warmup_iters: 200
  domain_rand: true
  geom_aug: false
  class_weights: [0.25, 1]
train:
  iters: 26000
  batch_size: 2
  lr: 0.0001
  lr_warmup_iters: 600
  ema_decay: 0.99
  class_weights: [1.0, 0.5]
  sup_weight: [1, 0.5, 4000]
  ramp_iters: 4000
  domain_rand: true
  strong_aug: [0.6, 0.5, 0.3, 0.0]
  restart_at: 0
  restart_every: 0
  eval_batch_size: 1
  eval_largest_cc: false
