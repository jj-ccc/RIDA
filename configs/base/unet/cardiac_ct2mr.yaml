# unet cardiac_ct2mr
_base_: ./unet.yaml
benchmark: cardiac
direction: ct2mr
classes: [AA, LAC, LVC, MYO]
evaluation: medical
data:
  source: data/cardiac/CT
  target: data/cardiac/MR
  num_classes: 5
  pl_class_weights: [0.5, 1, 1, 1, 1]
model:
  in_channels: 3
  base_channels: 32
warmup:
  iters: 6000
  batch_size: 16
  lr_schedule: constant
  lr_warmup_iters: 0
  domain_rand: true
  geom_aug: false
  class_weights: [0.1, 1, 1, 1, 1]
train:
  iters: 26000
  batch_size: 8
  lr: 0.0001
  lr_warmup_iters: 300
  ema_decay: 0.99
  class_weights: [0.1, 1.5, 2.5, 1, 1.5]
  sup_weight: 1.0
  ramp_iters: 2000
  domain_rand: true
  strong_aug: [0.4, 0.4, 0.2, 0.0]
  restart_at: 4000
  restart_every: 4000
  eval_batch_size: 8
  eval_largest_cc: true
  restart_ramp: 1000
  restart_pl_class_weights: [0.5, 1, 1.5, 1, 1]
