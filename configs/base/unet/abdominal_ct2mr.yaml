# unet abdominal_ct2mr
_base_: ./unet.yaml
benchmark: abdominal
direction: ct2mr
classes: [Spleen, R.Kidney, L.Kidney, Liver]
evaluation: medical
data:
  source: data/abdominal/CT
  target: data/abdominal/MR
  num_classes: 5
model:
  in_channels: 3
  base_channels: 32
warmup:
  iters: 5000
  batch_size: 16
  lr_schedule: constant
  lr_warmup_iters: 0
  domain_rand: false
  geom_aug: true
  class_weights: [0.1, 1, 2, 2, 1]
train:
  iters: 17000
  batch_size: 6
  lr: 0.0002
  lr_warmup_iters: 300
  ema_decay: 0.99
  class_weights: [0.1, 1, 2, 2, 1]
  sup_weight: 1.0
  ramp_iters: 2000
  domain_rand: false
  strong_aug: [0.8, 0.5, 0.5, 0.5]
  restart_at: 0
  restart_every: 0
  eval_batch_size: 6
  eval_largest_cc: true
