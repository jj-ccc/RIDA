# medsam abdominal_mr2ct
_base_: ./medsam.yaml
benchmark: abdominal
direction: mr2ct
classes: [Spleen, R.Kidney, L.Kidney, Liver]
evaluation: medical
data:
  source: data/abdominal/MR
  target: data/abdominal/CT
  num_classes: 5
  pl_class_weights: [0.1, 1, 2, 2, 1]
model:
  lora_rank: 4
warmup:
  iters: 4000
  batch_size: 4
  lr: 0.0005
  lr_schedule: constant
  lr_warmup_iters: 0
  domain_rand: true
  geom_aug: false
  class_weights: [0.1, 1, 2, 2, 1]
train:
  iters: 7000
  batch_size: 3
  lr: 3.0e-05
  lr_warmup_iters: 200
  weight_decay: 0.0005
  ema_decay: 0.99
  class_weights: [0.1, 1, 2, 2, 1]
  sup_weight: 1.0
  pl_target: soft
  freeze_bn: false
  domain_rand: true
  geom_aug: false
  strong_aug: [0.8, 0.5, 0.5, 0.5]
  optimizer_reset: true
  restart_every: 0
  eval_batch_size: 3
  eval_largest_cc: true
  flip_teacher: false
  freeze_encoder: false
