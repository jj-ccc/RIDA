# dinov3 abdominal_ct2mr
_base_: ./dinov3.yaml
benchmark: abdominal
direction: ct2mr
classes: [Spleen, R.Kidney, L.Kidney, Liver]
evaluation: medical
data:
  source: data/abdominal/CT
  target: data/abdominal/MR
  num_classes: 5
model:
  freeze_encoder: false
  trainable_blocks: 4
  decoder_channels: 64
warmup:
  iters: 3000
  batch_size: 8
  lr: 0.0001
  lr_schedule: cosine
  lr_warmup_iters: 200
  geom_aug: false
  class_weights: [0.1, 1, 1, 1, 1]
train:
  iters: 11000
  batch_size: 4
  lr: 0.0001
  lr_schedule: cosine
  lr_warmup_iters: 300
  ema_decay: 0.999
  class_weights: [0.1, 1, 1, 1, 1]
  sup_weight: [1, 0.5, 2000]
  freeze_bn: true
  domain_rand: true
  geom_aug: false
  strong_aug: [0.6, 0.5, 0.3, 0.0]
  encoder_lr_mult: 0.1
  optimizer_reset: false
  restart_at: 0
  restart_every: 0
  eval_largest_cc: true
