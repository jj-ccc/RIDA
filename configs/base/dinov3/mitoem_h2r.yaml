# dinov3 mitoem_h2r
_base_: ./dinov3.yaml
benchmark: mitoem
direction: h2r
classes: [mito]
evaluation: em
data:
  source: data/em/mitoem_human
  target: data/em/mitoem_rat
  num_classes: 2
model:
  freeze_encoder: false
  trainable_blocks: 4
  decoder_channels: 128
warmup:
  iters: 5000
  batch_size: 12
  lr: 0.0005
  lr_schedule: cosine
  lr_warmup_iters: 200
  geom_aug: true
  class_weights: [0.1, 1]
train:
  iters: 29000
  batch_size: 4
  lr: 0.00015
  lr_schedule: cosine
  lr_warmup_iters: 300
  ema_decay: 0.999
  class_weights: [0.1, 1]
  sup_weight: [1, 0.5, 2000]
  freeze_bn: true
  domain_rand: false
  geom_aug: true
  strong_aug: [0.6, 0.5, 0.3, 0.0]
  encoder_lr_mult: 0.1
  optimizer_reset: false
  restart_at: 0
  restart_every: 8000
  eval_largest_cc: false
