# dinov3 cardiac_ct2mr
_base_: ./dinov3.yaml
benchmark: cardiac
direction: ct2mr
classes: [AA, LAC, LVC, MYO]
evaluation: medical
data:
  source: data/cardiac/CT
  target: data/cardiac/MR
  num_classes: 5
  pl_class_weights: [0.1, 1.5, 2.5, 1, 1.5]
model:
  freeze_encoder: true
  trainable_blocks: 0
  decoder_channels: 64
warmup:
  iters: 4000
  batch_size: 12
  lr: 0.0005
  lr_schedule: constant
  lr_warmup_iters: 0
  geom_aug: true
  class_weights: [0.1, 1, 1, 1, 1]
train:
  iters: 9000
  batch_size: 12
  lr: 0.0005
  lr_schedule: constant
  lr_warmup_iters: 0
  ema_decay: 0.99
  class_weights: [0.1, 1.5, 2.5, 1, 1.5]
  sup_weight: 1.0
  freeze_bn: false
  domain_rand: true
  geom_aug: false
  strong_aug: [0.8, 0.5, 0.5, 0.5]
  encoder_lr_mult: 1.0
  optimizer_reset: true
  restart_at: 1000
  restart_every: 0
  eval_largest_cc: true
